name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/fortune-telling-pwa-app-v2uubt
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；不取消進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 這是純靜態網站（原生 ES Modules），不需要建置步驟
      - name: Configure Pages
        # enablement: true 會在 Pages 尚未啟用時自動開啟（來源設為 GitHub Actions）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

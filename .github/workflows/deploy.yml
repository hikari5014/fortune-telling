name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；不取消進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 沒過就不部署。零相依：Node 內建的 node:test，不需要 npm install
      - name: Run tests
        run: node --test --test-reporter=spec tests/*.test.js

      # 避免 App 版號與離線快取版號不同步就上線
      - name: Check version consistency
        run: python3 tools/check_version.py

      # 這是純靜態網站（原生 ES Modules），不需要建置步驟
      # 前提：repo 的 Settings → Pages → Source 已設為「GitHub Actions」
      # （預設的 GITHUB_TOKEN 沒有權限自動建立 Pages 站台，這一步需手動設定一次）
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="玄鑑">
  <!-- 玄鑑的標誌：星軌、經緯、天心。
       靛黑底、鎏金線，跟 App 的鎏金主題同一套色。
       tools/make_icons.py 依同一組座標畫出 PNG 版本 —— 兩邊沒有共用程式，
       只有共用的數字，所以這裡改了那裡也要跟著改。 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141836"/>
      <stop offset="50%" stop-color="#0E122B"/>
      <stop offset="100%" stop-color="#080A18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#DFB15B"/>
      <stop offset="70%" stop-color="#F5CF78"/>
      <stop offset="100%" stop-color="#BF9035"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DFB15B" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#DFB15B" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#DFB15B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <g stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 外圈星軌 -->
    <circle cx="256" cy="256" r="160" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="4 8"/>
    <!-- 中圈子午線 -->
    <circle cx="256" cy="256" r="128" stroke-width="3.5" stroke-opacity="0.85"/>
    <!-- 內圈刻度環 -->
    <circle cx="256" cy="256" r="88" stroke-width="2" stroke-opacity="0.5"/>

    <!-- 四正 -->
    <line x1="256" y1="84" x2="256" y2="114" stroke-width="4"/>
    <line x1="256" y1="398" x2="256" y2="428" stroke-width="4"/>
    <line x1="84" y1="256" x2="114" y2="256" stroke-width="4"/>
    <line x1="398" y1="256" x2="428" y2="256" stroke-width="4"/>
    <!-- 四隅 -->
    <line x1="134" y1="134" x2="154" y2="154" stroke-width="3" stroke-opacity="0.75"/>
    <line x1="378" y1="134" x2="358" y2="154" stroke-width="3" stroke-opacity="0.75"/>
    <line x1="134" y1="378" x2="154" y2="358" stroke-width="3" stroke-opacity="0.75"/>
    <line x1="378" y1="378" x2="358" y2="358" stroke-width="3" stroke-opacity="0.75"/>

    <!-- 中央四芒星 -->
    <path d="M 256 160 Q 256 256 352 256 Q 256 256 256 352 Q 256 256 160 256 Q 256 256 256 160 Z"
          stroke-width="5" fill="#DFB15B" fill-opacity="0.12"/>
    <path d="M 256 196 Q 256 256 316 256 Q 256 256 256 316 Q 256 256 196 256 Q 256 256 256 196 Z"
          stroke-width="2.5" stroke-opacity="0.9"/>
  </g>

  <!-- 星點 -->
  <g fill="url(#gold)">
    <circle cx="256" cy="74" r="5"/><circle cx="256" cy="438" r="5"/>
    <circle cx="74" cy="256" r="5"/><circle cx="438" cy="256" r="5"/>
    <circle cx="124" cy="124" r="3.5"/><circle cx="388" cy="124" r="3.5"/>
    <circle cx="124" cy="388" r="3.5"/><circle cx="388" cy="388" r="3.5"/>
    <circle cx="256" cy="256" r="6"/>
  </g>
</svg>

<!doctype html>
<html lang="zh-Hant" data-theme="dark" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>玄鑑 — 導覽（扇形分類 · 滑選清單）</title>
<meta name="description" content="四種分類導覽互動的可試玩原型：輪盤、拇指扇、滑選清單、兩段輪盤。">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;900&family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="./nav.css">
<script>
  try {
    const t = localStorage.getItem('xj.lab.theme');
    if (t) document.documentElement.dataset.theme = t;
    else if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
  } catch {}
</script>
</head>
<body>

<header class="bar">
  <div>
    <p class="bar__eyebrow">NAVIGATION LAB</p>
    <h1 class="bar__title">導覽試玩</h1>
  </div>
  <button class="iconbtn" id="theme" aria-label="切換深淺色"></button>
</header>

<main id="app">
  <section class="intro">
    <p>分類列排成<b>扇形</b>，正中央下面那顆是<b>首頁</b>，工具收在最左邊。
      底下的細項用<b>滑選清單</b>呈現 —— 這是已經選定的方向。</p>
    <p class="hint">用法：<b>點一下</b>分類，選單就停在畫面上；再<b>點一下</b>要的那一項。
      也可以<b>按著滑過去再放開</b>，兩種都通。已經沒有長按了。<br>
      另外兩種排法（輪盤、拇指扇）留著讓你對照，換過去之後操作方式完全一樣。</p>
  </section>

  <nav class="modes" id="modes" aria-label="選擇方案"></nav>
  <section class="note card" id="note"></section>

  <section class="stage">
    <div class="stage__hint" id="stage-hint">按住下面的分類試試看</div>
    <div class="stage__screen" id="screen">
      <div class="fake" id="fake"></div>
      <div class="dock" id="dock" aria-label="分類"></div>
    </div>
  </section>

  <section class="card">
    <div class="card__head"><h2>試玩紀錄</h2><button class="chip" id="reset">歸零</button></div>
    <div class="stats" id="stats"></div>
    <ol class="log" id="log"><li class="log__empty">還沒選過東西。</li></ol>
  </section>

  <section class="card">
    <div class="card__head"><h2>參數</h2></div>
    <label class="opt"><span>扇形起伏<b id="rise-v">30 px</b></span>
      <input type="range" id="rise" min="0" max="56" step="2" value="30"></label>
    <label class="opt"><span>按鈕外傾<b id="tilt-v">13°</b></span>
      <input type="range" id="tilt" min="0" max="26" step="1" value="13"></label>
    <label class="opt"><span>選單半徑（輪盤／拇指扇才用得到）<b id="rad-v">118 px</b></span>
      <input type="range" id="rad" min="80" max="170" step="2" value="118"></label>
    <label class="opt opt--row"><span>震動回饋</span><input type="checkbox" id="haptic" checked></label>
    <label class="opt opt--row"><span>畫出手指的方向線</span><input type="checkbox" id="ray" checked></label>
    <label class="opt opt--row"><span>降低動態</span><input type="checkbox" id="calm"></label>
    <p class="hint" id="haptic-note"></p>
  </section>

  <section class="card">
    <div class="card__head"><h2>我的建議</h2></div>
    <div id="verdict"></div>
  </section>
</main>

<div class="menu-root" id="menu-root" hidden></div>
<div class="toast-root" id="toast-root"></div>

<script type="module" src="./nav.js"></script>
</body>
</html>
